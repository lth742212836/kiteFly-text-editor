<!DOCTYPE html>
<!--
  index.html - 应用入口 HTML 文件
  Vite 构建时会以此为模板，注入打包后的 JS/CSS 资源
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; 
    script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; 
    worker-src 'self' blob:; 
    font-src 'self' data: https://*.vscode-unpkg.net;
    style-src 'self' 'unsafe-inline';" />
  <title>TxtEdit - 文本编辑器</title>
  <style>
    /* 全局基础样式，消除默认边距并确保全屏布局 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
